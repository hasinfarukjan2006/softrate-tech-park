<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#00A8A8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Softrate 'S' Cube/Helix) -->
  <g transform="translate(10, 10)">
    <!-- Back Hexagon/Shield -->
    <path d="M 40 5 L 75 25 L 75 65 L 40 85 L 5 65 L 5 25 Z" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.3"/>
    
    <!-- Central Interlocking S-Shape (Tech Style) -->
    <!-- Top Arc of S -->
    <path d="M 25 35 C 25 20, 55 20, 55 35 C 55 45, 25 45, 25 55 C 25 70, 55 70, 55 55" fill="none" stroke="url(#logoGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small tech nodes -->
    <circle cx="25" cy="35" r="4.5" fill="#0F4C81"/>
    <circle cx="55" cy="55" r="4.5" fill="#00A8A8"/>
    <circle cx="40" cy="45" r="3.5" fill="#FFB703"/>
  </g>

  <!-- Logo Text (Softrate Tech Park) -->
  <g transform="translate(100, 0)">
    <!-- "SOFTRATE" -->
    <text x="0" y="48" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#0F4C81" letter-spacing="1">SOFTRATE</text>
    <!-- "TECH PARK" -->
    <text x="160" y="48" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#00A8A8" letter-spacing="1">TECH PARK</text>
    <!-- "PVT. LTD." in accent badge -->
    <rect x="0" y="60" width="75" height="18" rx="4" fill="url(#accentGrad)"/>
    <text x="8" y="73" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#1F2937" letter-spacing="0.5">PVT. LTD.</text>
    <!-- Small tagline -->
    <text x="85" y="73" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#6B7280" letter-spacing="0.5">GST Service Portal</text>
  </g>
</svg>
